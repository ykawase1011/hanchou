automations:
  - name: hch-work-weekly-dependency-audit
    cron: "0 10 * * 1"
    repo: ~/Workspace/Repositories/hanchou
    workspace: worktree
    agent: codex
    model: gpt-5.6-terra
    prompt: |
      Read the active Hanchou Beads database through BEADS_DIR.
      Audit ready and blocked dependency consistency and write a bounded report.
      Emit a completed or failed Hanchou Relay event to orchestrator.
      The schedule reporting policy is on_change; do not directly contact the user.
    timeout_minutes: 45
    catch_up_minutes: 240
    disabled: true

  # Temporary fresh-Agent fallback. The final daily digest uses the planned
  # existing-orchestrator target so the same L0 session composes the report.
  - name: hch-personal-daily-digest-source
    cron: "0 9 * * *"
    repo: ~/Workspace/Repositories/hanchou
    workspace: root
    agent: codex
    model: gpt-5.6-terra
    prompt: |
      Collect bounded Beads, Herdr, Automation-history, Decision, and usage data.
      Write the source report and emit a schedule_due Relay event to orchestrator.
      Do not perform new project research or directly publish the final digest.
    timeout_minutes: 30
    catch_up_minutes: 180
    disabled: true
