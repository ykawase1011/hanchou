schema_version = 1
default_policy = "deny"

# This public example is never an authorization source. A human may copy only
# reviewed entries to ~/.config/hanchou/<profile>/projects.local.toml.

# Least-privilege default: authorize one exact Git repository.
[[projects]]
id = "example-app"
path = "~/HanchouWorkspace/work/repositories/example-app"
allowed_profiles = ["work"]
default_leaf_role = "implementer"
default_leaf_kind = "codex"
labels = ["project:example-app", "scope:work"]

# Optional convenience boundary. Uncomment only after reviewing the whole
# directory: every Git top-level strictly below it may be dispatched. Never use
# $HOME, a directory containing secrets, or a mixed downloads/imports tree.
#
# [[workspace_roots]]
# id = "work-repositories"
# path = "~/HanchouWorkspace/work/repositories"
# allowed_profiles = ["work"]
# trust = "descendant-git-repositories"
