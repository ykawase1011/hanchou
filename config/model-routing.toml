schema_version = 1

[thresholds]
pressure_remaining_percent = 25
critical_remaining_percent = 10
stale_after_minutes = 180

[policy]
max_concurrency_normal = 4
max_concurrency_one_provider_pressure = 2
max_concurrency_both_pressure = 1
japanese_final_provider = "codex"
keep_orchestrator_provider = true

[routes.orchestrator]
task_kinds = ["control", "conversation", "decision"]
primary_provider = "codex"
primary_model = "gpt-5.6-sol"
primary_effort = "high"

[routes.mission-lead]
task_kinds = ["planning", "integration", "complex-review"]
primary_provider = "claude"
primary_model = "opus"
fallback_provider = "codex"
fallback_model = "gpt-5.6-sol"

[routes.researcher]
task_kinds = ["research", "investigation"]
primary_provider = "claude"
primary_model = "sonnet"
fallback_provider = "codex"
fallback_model = "gpt-5.6-terra"

[routes.implementer]
task_kinds = ["code", "test", "fix"]
primary_provider = "codex"
primary_model = "gpt-5.6-terra"
fallback_provider = "claude"
fallback_model = "sonnet"

[routes.reviewer]
task_kinds = ["code-review", "artifact-review"]
primary_provider = "codex"
primary_model = "gpt-5.6-terra"
fallback_provider = "claude"
fallback_model = "sonnet"

[routes.writer]
task_kinds = ["writing", "japanese", "business-writing", "final-prose-review"]
primary_provider = "codex"
primary_model = "gpt-5.6-terra"
fallback_provider = "codex"
fallback_model = "gpt-5.6-sol"
force_provider = true

[routes.editor]
task_kinds = ["prose-review", "japanese-review", "final-output-review"]
primary_provider = "codex"
primary_model = "gpt-5.6-terra"
fallback_provider = "codex"
fallback_model = "gpt-5.6-sol"
force_provider = true
