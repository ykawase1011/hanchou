<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-a6cGjA1oyVsvVg9JnrMZ/xmXfxrQH4U+wqasEfG8kLU='; style-src 'sha256-tNipOAQQ0qiXnwF70ZlI0L3zo8QVRW6LZV4Bw0gzqZA='; connect-src 'none'; img-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Hanchou — 状況スナップショット</title>
<style>
:root{color-scheme:light;--ink:#243831;--muted:#53675f;--line:#c9d5cf;--paper:#fff;--bg:#f3f5f1;--accent:#215b46;--warn:#774513}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,sans-serif}a{color:var(--accent);text-underline-offset:.2em}a:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #986200;outline-offset:3px}.skip{position:absolute;left:1rem;top:-5rem;background:white;padding:.5rem}.skip:focus{top:1rem}main,header,footer{max-width:1140px;margin:auto;padding:1.5rem}header{padding-top:2.5rem;padding-bottom:.5rem}.eyebrow{letter-spacing:.13em;font-size:.8rem;font-weight:700;color:var(--accent)}h1{font-size:clamp(1.8rem,4vw,2.8rem);line-height:1.3;margin:.5rem 0}h2{font-size:1.3rem;margin:0 0 1rem}h3{font-size:1.1rem;margin:0 0 .5rem}p{margin:.4rem 0}.muted,.meta{color:var(--muted);font-size:.9rem}.notice{border-left:4px solid var(--accent);padding:.6rem 1rem;background:#e6eee7;margin:1rem 0}.warning{color:var(--warn)}.toolbar{display:flex;gap:1rem;flex-wrap:wrap;margin:0 0 1.5rem}.toolbar label{display:grid;gap:.25rem;flex:1;min-width:190px}input,select{font:inherit;color:var(--ink);background:white;border:1px solid #85988e;border-radius:6px;padding:.55rem;width:100%}section{margin-bottom:2rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:1rem}.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:1.15rem;min-width:0;overflow-wrap:anywhere}.tag{display:inline-block;font-size:.8rem;border:1px solid var(--line);padding:.1rem .55rem;border-radius:1rem;margin:0 .35rem .5rem 0}.facts{display:grid;grid-template-columns:6.5rem 1fr;gap:.35rem .6rem;margin:.8rem 0}.facts dt{color:var(--muted)}.facts dd{margin:0;white-space:pre-wrap}.copy{white-space:pre-wrap;overflow-wrap:anywhere}details{border-top:1px solid var(--line);margin-top:1rem;padding-top:.7rem}summary{cursor:pointer;font-weight:650}blockquote{margin:.7rem 0;padding:.5rem .8rem;border-left:3px solid var(--line);background:var(--bg);white-space:pre-wrap}ul{padding-left:1.3rem}.empty{border:1px dashed var(--line);padding:1rem;border-radius:8px;color:var(--muted)}footer{border-top:1px solid var(--line);font-size:.85rem;color:var(--muted)}[hidden]{display:none!important}@media(max-width:520px){header,main,footer{padding:1rem}.facts{grid-template-columns:1fr;gap:.1rem}.facts dd{margin-bottom:.4rem}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<a class="skip" href="#main">内容へ移動</a>
<header><div class="eyebrow">HANCHOU / LOCAL SNAPSHOT</div><h1>頼んだこと、今わかること。</h1><p>読み取り専用の時点情報です。ライブ監視ではなく、開いても更新されません。</p><div id="overview" class="notice">未取得 — 表示用データを確認しています。</div></header>
<main id="main" tabindex="-1">
<div class="toolbar"><label>依頼を検索<input id="search" type="search" placeholder="依頼・原文・訂正・担当" autocomplete="off"></label><label>状態で絞り込み<select id="filter"><option value="all">すべて</option><option value="decision">判断が必要</option><option value="active">進行中</option><option value="waiting">外部待ち</option><option value="result">最近の受入済み成果</option><option value="unknown">不明・要再確認</option></select></label></div>
<p id="count" role="status" aria-live="polite" class="meta"></p>
<div id="requests"></div>
<section aria-labelledby="worktree-heading"><h2 id="worktree-heading">関連する作業場所</h2><p class="meta">親子関係は Orca の観測によります。Git の分岐関係や表示名からは推定しません。</p><div id="worktrees" class="grid"></div></section>
<noscript><p class="empty">JavaScript が無効です。表示は利用できません。正本を確認してください。</p></noscript>
</main>
<footer>作業・所有・判断の正本は Orca、PR の事実は GitHub。表示・検索・リンク閲覧は承認や作業指示になりません。再確認や更新は担当 coordinator に依頼してください。</footer>
<!-- Replace ONLY the base64 payload below with UTF-8 JSON, never raw JSON/HTML. -->
<script id="snapshot" type="application/octet-stream">e30=</script>
<script>
'use strict';
(() => {
  const obj = value => value && typeof value === 'object' && !Array.isArray(value) ? value : {};
  const list = value => Array.isArray(value) ? value.map(obj) : [];
  const str = (value, fallback = '未取得') => typeof value === 'string' && value.trim() ? value : fallback;
  const el = (tag, text, cls) => {
    const node = document.createElement(tag);
    if (text !== undefined) node.textContent = text;
    if (cls) node.className = cls;
    return node;
  };
  const time = value => {
    if (typeof value !== 'string' || !/^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(?:\.\d+)?(?:Z|[+-]\d\d:\d\d)$/.test(value)) return null;
    const parsed = Date.parse(value);
    return Number.isFinite(parsed) ? parsed : null;
  };
  let data;
  try {
    const encoded = document.getElementById('snapshot').textContent.trim();
    if (!/^[A-Za-z0-9+/]*={0,2}$/.test(encoded)) throw Error('encoding');
    data = obj(JSON.parse(new TextDecoder('utf-8', {fatal:true}).decode(Uint8Array.from(atob(encoded), c => c.charCodeAt(0)))));
    if (data.version !== 1) throw Error('version');
  } catch {
    document.getElementById('overview').textContent = '表示用データが未取得・破損・未対応です。正本は変更されていません。担当 coordinator に再生成を依頼してください。';
    document.querySelector('.toolbar').hidden = true;
    return;
  }
  const generated = time(data.generatedAt);
  const ageLimit = Number.isFinite(data.staleAfterHours) && data.staleAfterHours > 0 ? data.staleAfterHours * 3600000 : null;
  const freshness = record => {
    const observed = time(record.observedAt);
    const state = {stale:'古い観測・要再確認',unknown:'状態不明',missing:'取得不能・欠損',conflict:'観測に矛盾・要再確認'}[record.quality];
    if (state) return state;
    if (record.quality !== 'observed' || observed === null) return '観測不明・要再確認';
    if (observed > Date.now() + 60000 || generated === null || observed > generated) return '時刻に矛盾・要再確認';
    if (ageLimit === null) return '鮮度基準未設定・要再確認';
    return Date.now() - observed > ageLimit ? '古い観測・要再確認' : '観測時点の情報';
  };
  const evidence = (parent, record) => {
    parent.append(el('p', `観測: ${time(record.observedAt) === null ? '不明' : record.observedAt} · ${freshness(record)}`, 'meta'));
    parent.append(el('p', `出典: ${str(record.source)} / 範囲: ${str(record.scope)}`, 'meta'));
    if (record.note) parent.append(el('p', str(record.note), 'warning copy'));
  };
  const fact = (container, label, value) => {container.append(el('dt', label), el('dd', str(value)));};
  // Exact project and URL validation: no guessed Orca/local/deep links.
  const safeURL = (value, project) => {
    if (typeof value !== 'string' || typeof project !== 'string' || !/^github:[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(project)) return null;
    try {
      const url = new URL(value);
      const prefix = '/' + project.slice(7) + '/';
      if (url.protocol !== 'https:' || url.hostname !== 'github.com' || url.port || url.username || url.password || url.search || !url.pathname.startsWith(prefix)) return null;
      if (!/^(issues|pull)\/[1-9]\d*$/.test(url.pathname.slice(prefix.length)) || (url.hash && !/^#issuecomment-\d+$/.test(url.hash))) return null;
      return url.href;
    } catch { return null; }
  };
  const externalLink = (parent, record) => {
    if (!record.url) return;
    const url = safeURL(record.url, record.project);
    if (!url) {parent.append(el('p', 'リンク未検証 — 正本で確認', 'meta')); return;}
    const link = el('a', 'GitHub の出典を開く（外部）');
    link.href = url; link.target = '_blank'; link.rel = 'noopener noreferrer';
    parent.append(link);
  };
  const identity = value => {
    const v = obj(value);
    return ['identity','host','project'].every(k => typeof v[k] === 'string' && v[k]) ? JSON.stringify([v.identity,v.host,v.project]) : null;
  };
  const trees = list(data.worktrees);
  const findTree = ref => {
    const key = identity(ref);
    if (!key) return null;
    const matches = trees.filter(tree => identity(tree) === key);
    return matches.length === 1 ? matches[0] : null;
  };
  const overview = document.getElementById('overview');
  overview.replaceChildren(el('strong', str(data.title, 'ローカル状況ビュー')));
  overview.append(el('p', `生成: ${generated === null ? '不明' : data.generatedAt} · ${freshness({observedAt:data.generatedAt,quality:'observed'})}`, 'meta'));
  overview.append(el('p', `表示対象: ${str(data.coverage)} / 更新担当: ${str(data.writerLabel)}`));
  overview.append(el('p', '未掲載・沈黙は、仕事の不存在・停止・完了を意味しません。', 'meta'));
  for (const gap of list(data.gaps)) {const item=el('div',str(gap.text),'warning'); evidence(item,gap);overview.append(item);}
  const groups = [['decision','判断が必要'],['active','進行中'],['waiting','外部待ち'],['result','最近の受入済み成果'],['unknown','不明・要再確認']];
  const group = record => groups.some(([key]) => key === record.group) && (record.group !== 'result' || obj(record.lifecycle).acceptance === 'accepted') ? record.group : 'unknown';
  const lifecycleLabels = {
    worker:{reported:'完了報告あり（受入とは別）',working:'作業中の観測',failed:'失敗報告あり'},
    acceptance:{accepted:'coordinator 受入済み',pending:'未受入',rejected:'差戻し'},
    pr:{created:'作成済み',closed:'クローズ確認済み',none:'未作成'},
    merge:{merged:'マージ確認済み',pending:'未マージ',none:'未マージ'},
    cleanup:{done:'回収確認済み',retained:'保持中',pending:'未回収'}
  };
  function requestCard(record) {
    const card=el('article',undefined,'card');
    card.append(el('span',str(record.runLabel,'Run 未照合'),'tag'),el('h3',str(record.title)),el('p',str(record.summary),'copy'));
    const facts=el('dl',undefined,'facts');
    fact(facts,'次の担当',record.owner);fact(facts,'次の一歩',record.next);fact(facts,'判断・許可範囲',record.decision);fact(facts,'完了条件',record.acceptanceCriteria);
    card.append(facts);evidence(card,record);
    const stages=el('dl',undefined,'facts');
    for (const [key,label] of [['worker','worker'],['acceptance','成果受入'],['pr','PR'],['merge','マージ'],['cleanup','資源回収']]) {
      fact(stages,label,lifecycleLabels[key][obj(record.lifecycle)[key]] || '不明・未観測');
    }
    card.append(stages);
    for (const pr of list(record.pullRequests)) {const p=el('div');p.append(el('p',`${str(pr.label)} · ${str(pr.state)} / head: ${str(pr.head)}`));evidence(p,pr);externalLink(p,pr);card.append(p);}
    const details=el('details');details.append(el('summary','依頼原文・訂正・根拠を見る'));
    const original=obj(record.original);
    details.append(el('h3','依頼原文'),el('blockquote',str(original.text,'原文未取得 — Task の説明から復元していません。')));evidence(details,original);externalLink(details,original);
    details.append(el('h3','訂正・判断の経緯'));
    const changes=list(record.corrections);
    if (!changes.length) details.append(el('p','収録した訂正なし（網羅性は未保証）','meta'));
    for (const change of changes) {details.append(el('p',`${str(change.label)} / 置換対象: ${str(change.supersedes)}`,'meta'),el('blockquote',str(change.text)));evidence(details,change);externalLink(details,change);}
    details.append(el('h3','関連する作業場所'));
    const refs=list(record.worktreeRefs);
    if (!refs.length) details.append(el('p','関連未取得','meta'));
    for (const ref of refs) {
      const tree=findTree(ref);
      details.append(el('p',tree ? `${str(tree.label)} · ${str(tree.role)} · ${str(tree.presence)} · ${str(tree.hostLabel)} / ${str(tree.projectLabel)}` : '対応未確認 — identity・host・project の一致を確認できません。'));
    }
    card.append(details);return card;
  }
  const requests=list(data.requests);
  function render() {
    const query=document.getElementById('search').value.toLocaleLowerCase();
    const selected=document.getElementById('filter').value;
    const visible=requests.filter(record => {
      const searchText=[record.title,record.summary,record.owner,record.decision,obj(record.original).text,...list(record.corrections).map(c => c.text)].filter(v => typeof v==='string').join('\n').toLocaleLowerCase();
      return (selected==='all'||group(record)===selected) && searchText.includes(query);
    });
    const root=document.getElementById('requests');root.replaceChildren();
    document.getElementById('count').textContent=`表示 ${visible.length} / 収録 ${requests.length} 件（観測範囲内）`;
    for (const [key,label] of groups) {
      if (selected!=='all'&&selected!==key) continue;
      const section=el('section');const heading=el('h2',label);section.setAttribute('aria-label',label);section.append(heading);
      const records=visible.filter(record=>group(record)===key);
      if (!records.length) section.append(el('p','該当する収録情報はありません。未観測の仕事がないことは保証しません。','empty'));
      else {const grid=el('div',undefined,'grid');for(const record of records)grid.append(requestCard(record));section.append(grid);}
      root.append(section);
    }
  }
  const treeRoot=document.getElementById('worktrees');
  if (!trees.length) treeRoot.append(el('p','作業場所は未取得です。削除・不在とは判断できません。','empty'));
  for (const tree of trees) {
    const card=el('article',undefined,'card');
    card.append(el('span',str(tree.role),'tag'),el('h3',str(tree.label)));
    const facts=el('dl',undefined,'facts');
    const parent=findTree(tree.parent);
    const sameScope=parent && parent.host===tree.host && parent.project===tree.project;
    fact(facts,'親',sameScope && parent!==tree ? str(parent.label) : '関係未観測 / 親なしの観測は出典参照');
    fact(facts,'場所',`${str(tree.hostLabel)} / ${str(tree.projectLabel)}`);fact(facts,'存在の観測',tree.presence);fact(facts,'担当',tree.owner);fact(facts,'保持理由',tree.retainedReason);fact(facts,'次の確認',tree.nextReview);fact(facts,'過去の関係',tree.history);
    card.append(facts);evidence(card,tree);treeRoot.append(card);
  }
  document.getElementById('search').addEventListener('input',render);
  document.getElementById('filter').addEventListener('change',render);
  render();
})();
</script>
</body>
</html>
